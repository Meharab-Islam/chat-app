services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: chatapp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: chat_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis In-Memory Cache Service
  redis:
    image: redis:7-alpine
    container_name: chatapp_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js API Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatapp_api
    restart: always
    ports:
      - "${PORT:-5050}:5050"
    environment:
      NODE_ENV: production
      PORT: 5050
      CLIENT_URL: "*"
      DATABASE_URL: "mysql://root:rootpassword@mysql:3306/chat_db"
      REDIS_URL: "redis://redis:6379"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-token-key-change-in-production}"
      JWT_EXPIRES_IN: "7d"
      JWT_REFRESH_EXPIRES_IN: "30d"
      MAX_FILE_SIZE_MB: 100
      MAX_FILES_PER_REQUEST: 10
      UPLOAD_DIR: "uploads"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

